# Top-level study manifest for `cumulus-library build`.
#
# TEMPLATE NOTE: set `study_prefix` to your study's short prefix and keep it
# identical to PREFIX in tools/tablespace.py. All tables are named
# <study_prefix>__<table>.
#
# Each stage points at a submanifest TOML that is GENERATED by the matching
# tools/*.py generator. Run the spine once to (re)generate every submanifest and
# the rendered athena SQL:
#     python -m cumulus_study_builder.tools.study_builder
# then:
#     cumulus-library build --target example   (use your study_prefix)
study_prefix = "example"

[[stages.study_population]]
type = "submanifest"
files = ['study_population.toml']

[[stages.study_variable]]
type = "submanifest"
files = ['study_variable.toml']

[[stages.study_variable_wide]]
type = "submanifest"
files = ['study_variable_wide.toml']

[[stages.casedef]]
type = "submanifest"
files = ['casedef.toml']

[[stages.sample]]
type = "submanifest"
files = ['sample.toml']

# study-specific analytic / computable-phenotype layer (hand-authored SQL).
[[stages.eligible]]
type = "submanifest"
files = ['eligible.toml']

[[stages.study_meta]]
type = "submanifest"
files = ['study_meta.toml']

# Data-quality QA tests (zero-row assertions). Optional.
[[stages.test]]
type = "submanifest"
files = ['test.toml']

# Aggregate/count cubes for export/dashboards. Optional.
[[stages.cube]]
type = "submanifest"
files = ['cube.toml']

# --- Optional NLP / chart-review stages -------------------------------------
# The chart-review (LLM) layer lives under llm/ and is wired via nlp_*.toml.
# Enable these once you have Pydantic models + an NLP runner configured.
