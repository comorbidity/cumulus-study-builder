# cumulus-study-builder: installed once per environment, pinned by studies.
# Studies do NOT fork this repo -- they depend on it (see README).

[project]
name = "cumulus-study-builder"
version = "1.0.0"
requires-python = ">= 3.11"
dependencies = [
    # keep to the latest minor version of cumulus-library
    "cumulus-library >= 6.2.0",
    "sqlfluff >= 2.3.4",
    "pandas <3, >=2.1.3",
    "pydantic",
    "jinja2",
    "tomli-w",
    # Optional NLP/elastic integration (uncomment if you use the chart-review
    # sampling + rapid-elastic pipeline):
    # "rapid-elastic @ git+https://github.com/smart-on-fhir/rapid-elastic.git@main",
]
description = "The shared, versioned spine for Cumulus Library studies: generators, SQL templates, and agent skills."
readme = "README.md"
license = { text = "Apache License 2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Home = "https://smarthealthit.org/cumulus-a-universal-sidecar-for-a-smart-learning-healthcare-system/"
Documentation = "https://docs.smarthealthit.org/cumulus/"
Source = "https://github.com/smart-on-fhir/cumulus-study-builder"

[project.scripts]
cumulus-study-builder = "cumulus_study_builder.cli:main"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
dev = ["black", "pylint"]
test = ["pytest", "pytest-cov", "pytest-xdist"]

[tool.flit.sdist]
include = ["cumulus_study_builder/"]
